name: integration

# Live AWS tests, then a sweep of anything they left behind (PK-5). Requires an IAM role
# trusted for GitHub OIDC (repo secret AWS_ROLE_ARN) in an account where `skyhammer
# bootstrap` has been run, and the repo variable SKYHAMMER_NIGHTLY=true for nightly runs.
on:
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run training tests (30-60 min each, cents of spend)"
        type: boolean
        default: false
  schedule:
    - cron: "17 9 * * *"  # nightly fast tier: drift (catalog, Hub, prices) + smoke calls

permissions:
  contents: read
  id-token: write

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  live:
    # The nightly run is opt-in: set the repo variable SKYHAMMER_NIGHTLY=true once the
    # AWS_ROLE_ARN secret exists. Manual runs always go.
    if: github.event_name == 'workflow_dispatch' || vars.SKYHAMMER_NIGHTLY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: uv sync --locked
      - name: Live tests
        env:
          SKYHAMMER_INTEGRATION: "1"
          SKYHAMMER_INTEGRATION_SLOW: ${{ inputs.slow && '1' || '0' }}
        run: uv run pytest -q tests/integration
      - name: Sweep leftovers (skyhammer-it-*/skyhammer-smoke-* older than 6 h)
        if: always()  # test fixtures clean up after themselves; this catches what they miss
        run: uv run skyhammer cleanup --yes --graders --older-than-hours 6
